[package]
name = "lightflow-flux-preview-text-to-image"
version = "0.1.0"
edition = "2024"
description = "LightFlow FLUX preview workflow for deterministic text-to-image testing."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lightjunction/lightflow-flux"
keywords = ["lightflow", "workflow", "flux", "image"]
categories = ["development-tools"]

[package.metadata.lightflow]
runner = "lightflow-flux-preview-text-to-image-runner"

[[bin]]
name = "lightflow-flux-preview-text-to-image-runner"
path = "src/bin/runner.rs"

[dependencies]
lightflow = { workspace = true }
lightflow-flux-runtime = { workspace = true }
