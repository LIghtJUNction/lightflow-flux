[package]
name = "lightflow-flux-image-edit"
version = "0.1.0"
edition = "2024"
description = "LightFlow FLUX workflow for prompt-guided image editing."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lightjunction/lightflow-flux"
keywords = ["lightflow", "workflow", "flux", "image"]
categories = ["development-tools"]

[package.metadata.lightflow]
runner = "lightflow-flux-image-edit-runner"
runner-features = ["native"]

[features]
native = ["lightflow-flux-runtime/native"]

[[bin]]
name = "lightflow-flux-image-edit-runner"
path = "src/bin/runner.rs"

[dependencies]
lightflow = { workspace = true }
lightflow-flux-runtime = { workspace = true }
